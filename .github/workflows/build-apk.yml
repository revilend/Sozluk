name: Build APK (TurkUz DilKoprik)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js 20 sozlash
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java 17 (Temurin) sozlash
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Lugat bazasini yigish va www sync
        run: |
          npm install
          node scripts/build-data.mjs
          node scripts/sync-www.mjs

      - name: Android proyektini solishtirish
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Gradle Wrapper AGZOSI
        working-directory: android
        run: chmod +x gradlew

      - name: Debug APK yigish
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Artifact yuklash (TurkUz-DilKoprik-APK)
        uses: actions/upload-artifact@v4
        with:
          name: TurkUz-DilKoprik-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Release ga apk yuklash (v tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
